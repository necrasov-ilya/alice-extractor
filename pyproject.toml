[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-extractor"
version = "0.1.0"
description = "Model-aware search context extraction for AliceAI-T5"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "accelerate==1.14.0",
  "huggingface-hub==1.31.0",
  "safetensors==0.8.0",
  "torch==2.10.0",
  "transformers==5.14.1",
]

[project.scripts]
alice-extractor = "alice_extractor.cli:main"
alice-quantize-checkpoint = "alice_extractor.quantization:main"
alice-runtime-benchmark = "alice_extractor.runtime_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
